<!DOCTYPE html>
<html>
<head>
  <title>KevsFlix</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <div id="splashScreen">
    <h1 id="splashLogo">KevsFlix</h1>
  </div>

  <header>
    <h1>KevsFlix</h1>

    <div class="account-controls">
      <span id="accountStatus">Not signed in</span>
      <button id="guestBtn">Continue as Guest</button>
      <button id="signInBtn">Sign In</button>
      <button id="createAccountBtn">Create Account</button>
      <button id="signOutBtn" class="hidden">Sign Out</button>
    </div>

    <button id="toggleFormBtn">+ Add Show</button>
    <button id="toggleFormBtnM">+ Add Movie</button>
  </header>

  <section id="profileForm" class="form hidden">
    <input id="profileNameInput" placeholder="Profile name">
    <input id="profilePinInput" placeholder="Optional PIN" type="password" inputmode="numeric">
    <button id="saveProfileBtn">Create Profile</button>
  </section>

  <section id="addShowForm" class="form hidden">
    <input id="searchInput" placeholder="Search show:">
    <button id="searchShowBtn">Search</button>
    <div id="searchResults" class="search-results"></div>
  </section>

  <section id="addMovieForm" class="form hidden">
    <input id="searchInputM" placeholder="Search Movie:">
    <button id="searchMovieBtn">Search</button>
    <div id="searchResultsM" class="search-results"></div>
  </section>

  <section>
    <h2 id="showsTitle">Your Shows</h2>
    <div id="showsGrid" class="grid"></div>
  </section>

  <section>
    <h2 id="moviesTitle">Your Movies</h2>
    <div id="moviesGrid" class="grid"></div>
  </section>

  <div id="accountModal" class="modal hidden">
    <div class="modal-card">
      <h2 id="modalTitle">Account</h2>

      <label>Account Name</label>
      <input id="modalAccountName" type="text" placeholder="ex: Kevin">

      <label>PIN</label>
      <input id="modalPin" type="password" placeholder="4-digit PIN">

      <p id="modalError" class="modal-error"></p>

      <div class="modal-actions">
        <button id="modalCancelBtn">Cancel</button>
        <button id="modalSubmitBtn">Continue</button>
      </div>
    </div>
  </div>

    <div id="playerModal" class="modal hidden">
      <div class="player-card">

        <div class="player-header">
          <h2 id="playerTitle">Now Playing</h2>

          <div class="player-progress-section">
            <span id="savedProgressText"></span>

            <button id="saveProgressBtn">Save Progress</button>
            <button id="playerNextEpisodeBtn" class="hidden">Next Episode</button>

            <div id="progressInputs" class="hidden">
              <input id="hoursInput" type="number" min="0" placeholder="HH">
              <span>:</span>
              <input id="minutesInput" type="number" min="0" max="59" placeholder="MM">
              <span>:</span>
              <input id="secondsInput" type="number" min="0" max="59" placeholder="SS">

              <button id="confirmProgressBtn">Confirm</button>
              <button id="cancelProgressBtn">Cancel</button>
            </div>
          </div>

          <button id="closePlayerBtn">Close</button>
        </div>

        <iframe
          id="playerFrame"
          src=""
          allowfullscreen
          allow="fullscreen; autoplay; encrypted-media; picture-in-picture"
        ></iframe>

      </div>
    </div>

    <script src="dashboard.js"></script>
  </body>
</html>
